<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 - 格式转换工具</title>
<style>
  :root {
    --primary: #4F6EF7;
    --primary-light: #EEF1FE;
    --primary-dark: #3451D1;
    --bg: #F0F2F8;
    --card: #FFFFFF;
    --text: #1A1F36;
    --text-muted: #8A93B2;
    --border: #E4E7F0;
    --success: #22C55E;
    --danger: #EF4444;
    --shadow: 0 2px 16px rgba(79,110,247,0.08);
    --radius: 16px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", sans-serif;
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: var(--text);
  }

  .login-container {
    background: var(--card);
    border-radius: var(--radius);
    box-shadow: 0 20px 60px rgba(0,0,0,0.3);
    width: 100%;
    max-width: 420px;
    overflow: hidden;
  }

  .login-header {
    padding: 32px 32px 20px;
    text-align: center;
  }

  .logo {
    font-size: 40px;
    margin-bottom: 10px;
  }

  .logo-title {
    font-size: 22px;
    font-weight: 800;
    color: var(--text);
    margin-bottom: 6px;
  }

  .logo-sub {
    font-size: 13px;
    color: var(--text-muted);
  }

  .login-tabs {
    display: flex;
    border-bottom: 1px solid var(--border);
    margin: 0 32px;
  }

  .login-tab {
    flex: 1;
    padding: 14px 16px;
    text-align: center;
    font-size: 13px;
    font-weight: 600;
    color: var(--text-muted);
    cursor: pointer;
    border-bottom: 2px solid transparent;
    transition: all 0.2s;
  }

  .login-tab:hover {
    color: var(--primary);
  }

  .login-tab.active {
    color: var(--primary);
    border-bottom-color: var(--primary);
  }

  .login-body {
    padding: 28px 32px 32px;
  }

  .qrcode-container {
    text-align: center;
  }

  .qrcode-box {
    width: 200px;
    height: 200px;
    background: #F9FAFB;
    border: 1px dashed var(--border);
    border-radius: 12px;
    margin: 0 auto 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }

  .qrcode-box:hover {
    border-color: var(--primary);
    background: var(--primary-light);
  }

  .qrcode-icon {
    font-size: 48px;
    margin-bottom: 8px;
  }

  .qrcode-text {
    font-size: 13px;
    color: var(--text-muted);
  }

  .qrcode-tip {
    font-size: 13px;
    color: var(--text-muted);
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 6px;
    margin-top: 8px;
  }

  .qrcode-tip .refresh {
    color: var(--primary);
    cursor: pointer;
    font-weight: 600;
  }

  .qrcode-tip .refresh:hover {
    text-decoration: underline;
  }

  .social-login {
    margin-top: 20px;
    padding-top: 20px;
    border-top: 1px solid var(--border);
  }

  .social-title {
    text-align: center;
    font-size: 13px;
    color: var(--text-muted);
    margin-bottom: 16px;
  }

  .social-buttons {
    display: flex;
    gap: 16px;
    justify-content: center;
  }

  .social-btn {
    width: 52px;
    height: 52px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    transition: all 0.2s;
    font-size: 24px;
  }

  .social-btn:hover {
    transform: scale(1.1);
    box-shadow: 0 6px 20px rgba(0,0,0,0.15);
  }

  .social-btn.wechat {
    background: #07C160;
  }

  .social-btn.qq {
    background: #12B7F5;
  }

  .form-group {
    margin-bottom: 20px;
  }

  .form-label {
    font-size: 13px;
    font-weight: 600;
    color: var(--text);
    margin-bottom: 8px;
    display: block;
  }

  .form-input {
    width: 100%;
    padding: 12px 16px;
    border: 1px solid var(--border);
    border-radius: 10px;
    font-size: 14px;
    transition: all 0.2s;
  }

  .form-input:focus {
    outline: none;
    border-color: var(--primary);
    box-shadow: 0 0 0 3px rgba(79,110,247,0.1);
  }

  .code-input-group {
    display: flex;
    gap: 12px;
  }

  .code-input-group .form-input {
    flex: 1;
  }

  .code-btn {
    padding: 12px 20px;
    background: var(--primary-light);
    color: var(--primary);
    border: none;
    border-radius: 10px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.2s;
    white-space: nowrap;
  }

  .code-btn:hover {
    background: var(--primary);
    color: #fff;
  }

  .code-btn:disabled {
    background: var(--border);
    color: var(--text-muted);
    cursor: not-allowed;
  }

  .login-btn {
    width: 100%;
    padding: 14px;
    background: linear-gradient(135deg, var(--primary), #6C8EFF);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }

  .login-btn:hover {
    transform: translateY(-2px);
    box-shadow: 0 6px 20px rgba(79,110,247,0.4);
  }

  .agreement {
    margin-top: 16px;
    font-size: 12px;
    color: var(--text-muted);
    text-align: center;
  }

  .agreement a {
    color: var(--primary);
    text-decoration: none;
  }

  .agreement a:hover {
    text-decoration: underline;
  }

  .back-link {
    margin-top: 20px;
    text-align: center;
  }

  .back-link a {
    font-size: 13px;
    color: var(--text-muted);
    text-decoration: none;
    display: inline-flex;
    align-items: center;
    gap: 4px;
  }

  .back-link a:hover {
    color: var(--primary);
  }

  .phone-login-content,
  .qrcode-login-content,
  .account-login-content {
    display: none;
  }

  .phone-login-content.active,
  .qrcode-login-content.active,
  .account-login-content.active {
    display: block;
  }

  .qrcode-actual {
    display: none;
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: #fff;
    align-items: center;
    justify-content: center;
    font-size: 60px;
  }

  .qrcode-actual.active {
    display: flex;
  }

  .qrcode-status {
    margin-top: 12px;
    padding: 10px 16px;
    background: #FEF9C3;
    border-radius: 8px;
    font-size: 13px;
    color: #A16207;
    display: flex;
    align-items: center;
    gap: 6px;
  }

  .qrcode-status.success {
    background: #DCFCE7;
    color: #15803D;
  }

  .qrcode-countdown {
    font-size: 12px;
    color: var(--text-muted);
    margin-top: 8px;
  }

  .protocol-check {
    display: flex;
    align-items: flex-start;
    gap: 8px;
    margin-bottom: 20px;
  }

  .protocol-check input[type="checkbox"] {
    margin-top: 3px;
  }

  .protocol-check label {
    font-size: 12px;
    color: var(--text-muted);
    line-height: 1.5;
  }

  .protocol-check a {
    color: var(--primary);
    text-decoration: none;
  }

  .protocol-check a:hover {
    text-decoration: underline;
  }

  .error-msg {
    color: var(--danger);
    font-size: 12px;
    margin-top: 6px;
    display: none;
  }

  .admin-hint {
    background: linear-gradient(135deg, #FEF3C7, #FDE68A);
    border: 1px solid #F59E0B;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 20px;
    font-size: 12px;
    color: #92400E;
  }

  .admin-hint strong {
    color: #B45309;
  }
</style>
</head>
<body>

<div class="login-container">
  <div class="login-header">
    <div class="logo">📄</div>
    <div class="logo-title">格式转换工具</div>
    <div class="logo-sub">高效、安全、专业的文件格式转换平台</div>
  </div>

  <div class="login-tabs">
    <div class="login-tab active" onclick="switchLoginType('qrcode')">扫码登录</div>
    <div class="login-tab" onclick="switchLoginType('phone')">手机号登录</div>
    <div class="login-tab" onclick="switchLoginType('account')">账号登录</div>
  </div>

  <div class="login-body">
    <div class="qrcode-login-content active">
      <div class="qrcode-container">
        <div class="qrcode-box" onclick="showQrcode()">
          <div class="qrcode-icon">📱</div>
          <div class="qrcode-text">点击显示二维码</div>
          <div class="qrcode-actual" id="qrcodeActual">
            <span style="font-size: 80px;">📱</span>
          </div>
        </div>
        <div class="qrcode-tip">
          <span>请使用</span>
          <span class="social-btn wechat" style="width: 22px; height: 22px; font-size: 12px; margin: 0 4px;">💬</span>
          <span>或</span>
          <span class="social-btn qq" style="width: 22px; height: 22px; font-size: 12px; margin: 0 4px;">🐧</span>
          <span>扫码</span>
        </div>
        <div class="qrcode-tip">
          <span>二维码将在 <span id="countdown">60</span> 秒后过期</span>
          <span class="refresh" onclick="refreshQrcode()">刷新</span>
        </div>
        <div class="qrcode-status" id="qrcodeStatus">
          <span>⏳</span> 等待扫码...
        </div>
      </div>

      <div class="social-login">
        <div class="social-title">也可以使用以下方式直接登录</div>
        <div class="social-buttons">
          <div class="social-btn wechat" onclick="socialLogin('wechat')" title="微信登录">💬</div>
          <div class="social-btn qq" onclick="socialLogin('qq')" title="QQ登录">🐧</div>
        </div>
      </div>
    </div>

    <div class="phone-login-content">
      <div class="form-group">
        <label class="form-label">手机号码</label>
        <input type="tel" class="form-input" id="phoneInput" placeholder="请输入手机号码" maxlength="11">
      </div>

      <div class="form-group">
        <label class="form-label">验证码</label>
        <div class="code-input-group">
          <input type="text" class="form-input" id="codeInput" placeholder="请输入验证码" maxlength="6">
          <button class="code-btn" id="codeBtn" onclick="sendCode()">获取验证码</button>
        </div>
      </div>

      <div class="protocol-check">
        <input type="checkbox" id="protocolCheck" checked>
        <label for="protocolCheck">
          我已阅读并同意
          <a href="javascript:void(0)">《用户协议》</a>
          和
          <a href="javascript:void(0)">《隐私政策》</a>
        </label>
      </div>

      <button class="login-btn" onclick="phoneLogin()">登录 / 注册</button>

      <div class="agreement">
        登录即表示同意我们的 <a href="javascript:void(0)">服务条款</a> 和 <a href="javascript:void(0)">隐私政策</a>
      </div>
    </div>

    <div class="account-login-content">
      <div class="admin-hint">
        💡 <strong>管理员账号：</strong>admin &nbsp;|&nbsp; 密码：svn@yw
      </div>

      <div class="form-group">
        <label class="form-label">用户名</label>
        <input type="text" class="form-input" id="usernameInput" placeholder="请输入用户名">
        <div class="error-msg" id="usernameError">请输入用户名</div>
      </div>

      <div class="form-group">
        <label class="form-label">密码</label>
        <input type="password" class="form-input" id="passwordInput" placeholder="请输入密码">
        <div class="error-msg" id="passwordError">请输入密码</div>
      </div>

      <button class="login-btn" onclick="accountLogin()">登录</button>

      <div class="agreement" style="margin-top: 20px;">
        <a href="javascript:void(0)">忘记密码？</a> &nbsp;|&nbsp;
        <a href="javascript:void(0)">注册新账号</a>
      </div>
    </div>

    <div class="back-link">
      <a href="javascript:void(0)" onclick="goHome()">← 返回首页</a>
    </div>
  </div>
</div>

<script>
let countdownTimer = null;
let countdown = 60;
let codeTimer = null;
let codeCountdown = 0;

const ADMIN_USER = 'admin';
const ADMIN_PASS = 'svn@yw';

function switchLoginType(type) {
  document.querySelectorAll('.login-tab').forEach(tab => tab.classList.remove('active'));
  document.querySelectorAll('.qrcode-login-content, .phone-login-content, .account-login-content').forEach(content => content.classList.remove('active'));
  
  if (type === 'qrcode') {
    document.querySelectorAll('.login-tab')[0].classList.add('active');
    document.querySelector('.qrcode-login-content').classList.add('active');
    startCountdown();
  } else if (type === 'phone') {
    document.querySelectorAll('.login-tab')[1].classList.add('active');
    document.querySelector('.phone-login-content').classList.add('active');
  } else {
    document.querySelectorAll('.login-tab')[2].classList.add('active');
    document.querySelector('.account-login-content').classList.add('active');
  }
}

function showQrcode() {
  const qrcodeActual = document.getElementById('qrcodeActual');
  if (!qrcodeActual.classList.contains('active')) {
    qrcodeActual.classList.add('active');
    startCountdown();
    setTimeout(() => {
      const status = document.getElementById('qrcodeStatus');
      status.className = 'qrcode-status';
      status.innerHTML = '<span>✅</span> 扫码成功，正在登录...';
      setTimeout(() => {
        status.className = 'qrcode-status success';
        status.innerHTML = '<span>🎉</span> 登录成功！';
        
        const user = {
          isLoggedIn: true,
          name: '扫码登录用户',
          loginType: 'qrcode',
          loginTime: new Date().toISOString()
        };
        localStorage.setItem('formatToolUser', JSON.stringify(user));
        
        setTimeout(() => {
          goHome();
        }, 1000);
      }, 1500);
    }, 2000);
  }
}

function refreshQrcode() {
  countdown = 60;
  document.getElementById('countdown').textContent = countdown;
  document.getElementById('qrcodeStatus').innerHTML = '<span>⏳</span> 等待扫码...';
  document.getElementById('qrcodeStatus').className = 'qrcode-status';
  document.getElementById('qrcodeActual').classList.remove('active');
  startCountdown();
}

function startCountdown() {
  if (countdownTimer) clearInterval(countdownTimer);
  countdown = 60;
  countdownTimer = setInterval(() => {
    countdown--;
    document.getElementById('countdown').textContent = countdown;
    if (countdown <= 0) {
      clearInterval(countdownTimer);
      document.getElementById('qrcodeStatus').innerHTML = '<span>⚠️</span> 二维码已过期，请刷新';
      document.getElementById('qrcodeActual').classList.remove('active');
    }
  }, 1000);
}

function sendCode() {
  const phone = document.getElementById('phoneInput').value;
  if (!phone || phone.length !== 11) {
    alert('请输入正确的手机号码');
    return;
  }
  
  codeCountdown = 60;
  const codeBtn = document.getElementById('codeBtn');
  codeBtn.disabled = true;
  
  codeTimer = setInterval(() => {
    codeCountdown--;
    codeBtn.textContent = `${codeCountdown}秒后重试`;
    if (codeCountdown <= 0) {
      clearInterval(codeTimer);
      codeBtn.disabled = false;
      codeBtn.textContent = '获取验证码';
    }
  }, 1000);
  
  alert('验证码已发送至 ' + phone.substr(0,3) + '****' + phone.substr(7));
}

function phoneLogin() {
  const phone = document.getElementById('phoneInput').value;
  const code = document.getElementById('codeInput').value;
  const protocolCheck = document.getElementById('protocolCheck').checked;
  
  if (!phone || phone.length !== 11) {
    alert('请输入正确的手机号码');
    return;
  }
  
  if (!code || code.length !== 6) {
    alert('请输入正确的验证码');
    return;
  }
  
  if (!protocolCheck) {
    alert('请先同意用户协议和隐私政策');
    return;
  }
  
  const user = {
    isLoggedIn: true,
    name: '用户' + phone.substr(7),
    phone: phone.substr(0,3) + '****' + phone.substr(7),
    loginType: 'phone',
    loginTime: new Date().toISOString()
  };
  localStorage.setItem('formatToolUser', JSON.stringify(user));
  
  alert('登录成功！');
  goHome();
}

function socialLogin(type) {
  const typeName = type === 'wechat' ? '微信' : 'QQ';
  alert(`即将跳转${typeName}授权页面...`);
  setTimeout(() => {
    const user = {
      isLoggedIn: true,
      name: typeName + '用户',
      loginType: type,
      loginTime: new Date().toISOString()
    };
    localStorage.setItem('formatToolUser', JSON.stringify(user));
    
    alert(`${typeName}登录成功！`);
    goHome();
  }, 800);
}

function accountLogin() {
  const username = document.getElementById('usernameInput').value.trim();
  const password = document.getElementById('passwordInput').value;
  const usernameError = document.getElementById('usernameError');
  const passwordError = document.getElementById('passwordError');
  
  usernameError.style.display = 'none';
  passwordError.style.display = 'none';
  
  if (!username) {
    usernameError.style.display = 'block';
    return;
  }
  
  if (!password) {
    passwordError.style.display = 'block';
    return;
  }
  
  if (username === ADMIN_USER && password === ADMIN_PASS) {
    const user = {
      isLoggedIn: true,
      name: '管理员',
      role: 'admin',
      loginType: 'account',
      loginTime: new Date().toISOString()
    };
    localStorage.setItem('formatToolUser', JSON.stringify(user));
    alert('管理员登录成功！');
    goHome();
  } else {
    const user = {
      isLoggedIn: true,
      name: username,
      role: 'user',
      loginType: 'account',
      loginTime: new Date().toISOString()
    };
    localStorage.setItem('formatToolUser', JSON.stringify(user));
    alert('登录成功！');
    goHome();
  }
}

function goHome() {
  window.location.href = 'index.html';
}

document.addEventListener('DOMContentLoaded', () => {
  startCountdown();
});
</script>

</body>
</html>
